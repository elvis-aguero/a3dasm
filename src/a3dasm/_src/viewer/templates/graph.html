<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>a3dasm run viewer — {{ run_id }}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://unpkg.com/alpinejs@3.14.3/dist/cdn.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <style>
    [x-cloak] { display: none !important; }
    body { background: #0b0d10; color: #e7e5e2; }
    .node-card {
      background: #14171c; border: 1px solid #262b33; border-radius: 10px;
      padding: 10px 16px; cursor: pointer; transition: border-color .15s;
      font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 13px;
      min-width: 150px; text-align: center; position: relative;
    }
    .node-card:hover { border-color: #4b5563; }
    .node-card.entry { border-color: #b4690e; }
    .node-card.selected { border-color: #6b8cff; }
    .status-dot {
      display: inline-block; width: 9px; height: 9px; border-radius: 50%;
      margin-right: 7px; vertical-align: middle;
      background: #4b5563; /* idle/unknown */
    }
    .status-dot.done { background: #22c55e; }
    .status-dot.failed { background: #ef4444; }
    .status-dot.running {
      background: #ef4444;
      animation: pulse-glow 1.6s ease-in-out infinite;
    }
    @keyframes pulse-glow {
      0%   { box-shadow: 0 0 0 0 rgba(239,68,68,.55); }
      70%  { box-shadow: 0 0 0 10px rgba(239,68,68,0); }
      100% { box-shadow: 0 0 0 0 rgba(239,68,68,0); }
    }
    #edges-svg path { stroke: #3a4048; stroke-width: 1.6; fill: none; }
    .panel-transition { transition: all .2s ease-out; }

    /* One turn = one avatar + everything that model turn produced (thinking,
       text, tool calls, their results) as a SINGLE visually-grouped unit —
       the nested trace-tree convention real agent-trace viewers use, not a
       flat list of same-weight bubbles. */
    .turn {
      display: flex; gap: 10px; padding: 10px 4px; font-size: 13px;
      align-items: flex-start;
    }
    .turn + .turn { border-top: 1px solid #1a1e24; }
    .avatar {
      flex: none; width: 22px; height: 22px; border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 600; margin-top: 1px;
    }
    .avatar-assistant { background: #24314f; color: #8fa8ff; }
    .turn-body { min-width: 0; flex: 1; }
    .bubble-text { white-space: pre-wrap; line-height: 1.5; }
    .thinking {
      margin-bottom: 6px; font-size: 12px; color: #6b7280;
    }
    .thinking summary { cursor: pointer; }
    .thinking-text {
      white-space: pre-wrap; font-style: italic; margin-top: 4px;
      padding-left: 10px; border-left: 2px solid #1f242b;
    }
    .tool-call {
      display: flex; align-items: baseline; gap: 6px; margin-top: 6px;
      font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 12px;
      color: #9aa4b2; padding-left: 2px;
    }
    .tool-result-row {
      display: flex; align-items: baseline; gap: 6px; margin-top: 2px;
      margin-left: 14px; font-family: ui-monospace, 'SF Mono', Menlo, monospace;
      font-size: 11.5px; color: #6b7280; border-left: 2px solid #1f242b;
      padding-left: 8px;
    }
    .tool-icon { color: #4b5563; flex: none; }
    .tool-icon.result { color: #384049; }
    .tool-name { color: #c3cad6; }
    .tool-call details, .tool-result-row details { color: inherit; }
    .tool-call summary, .tool-result-row summary { cursor: pointer; }
    .tool-call pre, .tool-result-row pre, .thinking pre {
      background: #0e1013; padding: 8px; border-radius: 6px; overflow-x: auto;
      white-space: pre-wrap; word-break: break-word; margin-top: 4px;
    }
    .empty { color: #6b7280; font-size: 13px; padding: 12px; }
    .icon-btn {
      color: #9aa4b2; background: transparent; border: none; cursor: pointer;
      font-size: 13px; padding: 4px 8px; border-radius: 6px;
    }
    .icon-btn:hover { color: #fff; background: #1b1f26; }
    .key-chip {
      font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 11px;
      padding: 3px 8px; border-radius: 6px; border: 1px solid #262b33;
      cursor: pointer; color: #9aa4b2;
    }
    .key-chip.active { border-color: #6b8cff; color: #e7e5e2; }
    .run-status-pill {
      display: inline-flex; align-items: center; gap: 6px;
      font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 11px;
      letter-spacing: .03em; padding: 3px 10px; border-radius: 999px;
      border: 1px solid #262b33; color: #9aa4b2; background: #14171c;
    }
    .run-status-pill .status-dot { margin-right: 0; }
    .run-status-pill.gated { border-color: #22c55e; color: #22c55e; }
    .run-status-pill.ungated { border-color: #d97706; color: #d97706; }
    .run-status-pill.failed, .run-status-pill.crashed { border-color: #ef4444; color: #ef4444; }
    .run-status-pill.running .status-dot { background: #4b5563; }
    .problem-md { font-size: 13px; line-height: 1.55; }
    .problem-md :is(h1,h2,h3) { font-weight: 600; margin: 14px 0 6px; }
    .problem-md h1 { font-size: 16px; }
    .problem-md h2 { font-size: 14.5px; }
    .problem-md h3 { font-size: 13.5px; }
    .problem-md p { margin: 8px 0; }
    .problem-md ul, .problem-md ol { margin: 8px 0 8px 20px; }
    .problem-md li { margin: 3px 0; }
    .problem-md code {
      background: #14171c; border-radius: 4px; padding: 1px 5px;
      font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 12px;
    }
    .problem-md pre {
      background: #0e1013; border: 1px solid #1c2027; border-radius: 6px;
      padding: 10px; overflow-x: auto; margin: 8px 0;
    }
    .problem-md pre code { background: none; padding: 0; }
    .problem-md a { color: #6b8cff; }
    .problem-md blockquote {
      border-left: 2px solid #262b33; margin: 8px 0; padding-left: 10px;
      color: #9aa4b2;
    }

    .node-hover-card {
      position: fixed; z-index: 30; width: 280px; max-width: calc(100vw - 24px);
      overflow-y: auto; /* max-height is set inline, per hover (depends on top) */
      background: #14171c; border: 1px solid #262b33; border-radius: 10px;
      box-shadow: 0 12px 32px rgba(0,0,0,.45); padding: 12px;
      font-family: ui-sans-serif, system-ui; font-size: 12.5px; text-align: left;
      cursor: default;
    }
    .node-hover-card .hc-title {
      font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 13px;
      font-weight: 600; color: #e7e5e2;
    }
    .node-hover-card .hc-role {
      font-size: 10.5px; text-transform: uppercase; letter-spacing: .04em;
      color: #6b7280; margin-top: 1px;
    }
    .node-hover-card .hc-model {
      display: inline-block; margin-top: 8px; font-size: 11px;
      color: #8fa8ff; background: #1b2338; border-radius: 5px;
      padding: 2px 7px;
    }
    .node-hover-card .hc-desc {
      margin-top: 8px; color: #c3cad6; line-height: 1.45;
    }
    .node-hover-card .hc-label {
      margin-top: 10px; font-size: 10.5px; text-transform: uppercase;
      letter-spacing: .04em; color: #6b7280;
    }
    .node-hover-card .hc-tools {
      display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px;
    }
    .tool-badge {
      font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 10.5px;
      padding: 2px 6px; border-radius: 5px; background: #1b1f26;
      border: 1px solid #262b33; color: #9aa4b2; cursor: help;
    }
    .node-hover-card .hc-prompt {
      margin-top: 5px; max-height: 150px; overflow-y: auto;
      background: #0e1013; border: 1px solid #1c2027; border-radius: 6px;
      padding: 8px; font-family: ui-monospace, 'SF Mono', Menlo, monospace;
      font-size: 11px; white-space: pre-wrap; color: #9aa4b2; line-height: 1.4;
    }
  </style>
</head>
<body x-data="viewerApp()" x-init="init()" class="h-screen overflow-hidden flex flex-col">

  <header class="px-4 py-2 border-b border-[#1c2027] text-sm flex items-center gap-3 shrink-0">
    <span class="font-semibold">a3dasm</span>
    <span class="text-[#6b7280]">/</span>
    <span class="font-mono">{{ run_id }}</span>
    <span class="run-status-pill" :class="runStatusClass()" :title="runStatusTitle()">
      <span class="status-dot" :class="runStatus === null ? 'running' : ''"></span>
      <span x-text="runStatusLabel()"></span>
    </span>
    <button class="icon-btn ml-auto" @click="openProblemStatement()">Problem</button>
  </header>

  <main class="flex-1 relative overflow-auto p-8" id="graph-container">
    <svg id="edges-svg" class="absolute inset-0 w-full h-full pointer-events-none"></svg>
    <div class="relative flex flex-col items-center gap-16" id="graph-rows">
      <template x-for="row in rows" :key="row.layer">
        <div class="flex gap-10 justify-center flex-wrap">
          <template x-for="node in row.nodes" :key="node.name">
            <div class="node-card" :class="{ entry: node.is_entry, selected: node.name === selectedNode }"
                 :data-node="node.name"
                 @click="openNode(node)"
                 @mouseenter="onNodeHover(node, $event)"
                 @mouseleave="onNodeLeave()">
              <span class="status-dot" :class="statusClass(node.name)"></span>
              <span x-text="node.name"></span>
              <div class="text-[11px] text-[#6b7280] mt-1" x-text="node.role"></div>
            </div>
          </template>
        </div>
      </template>
    </div>
    <p class="empty" x-show="rows.length === 0">
      No graph structure available for this run.
    </p>
  </main>

  <!-- Node info hover card: fixed-positioned (not nested in the scrollable
       graph container) so it can never be clipped by main's overflow-auto. -->
  <div x-show="hoverNode !== null" x-cloak
       class="node-hover-card" :style="hoverStyle"
       @mouseenter="onPopoverEnter()" @mouseleave="onPopoverLeave()">
    <template x-if="hoverNode">
      <div>
        <div class="hc-title" x-text="hoverNode.name"></div>
        <div class="hc-role" x-text="hoverNode.role"></div>
        <span class="hc-model" x-text="hoverNode.model"></span>
        <div class="hc-desc" x-text="hoverNode.description || '(no description)'"></div>
        <div class="hc-label">Tools (<span x-text="hoverNode.tools.length"></span>)</div>
        <div class="hc-tools">
          <template x-for="t in hoverNode.tools" :key="t">
            <span class="tool-badge" :title="toolDocs[t] || '(no description)'"
                  x-text="displayToolName(t)"></span>
          </template>
        </div>
        <div class="hc-label">System prompt</div>
        <div class="hc-prompt" x-text="hoverNode.system_prompt || '(none)'"></div>
      </div>
    </template>
  </div>

  <!-- Problem statement modal -->
  <div x-show="problemOpen" x-cloak
       class="fixed inset-0 bg-black/60 flex items-center justify-center z-20"
       @click.self="problemOpen = false" @keydown.window.escape="problemOpen = false">
    <div class="bg-[#0e1013] border border-[#262b33] rounded-xl max-w-2xl w-full mx-4 h-[70vh] flex flex-col">
      <div class="flex items-center px-4 py-2 border-b border-[#1c2027] text-sm shrink-0">
        <span>Problem statement</span>
        <button class="icon-btn ml-auto" @click="problemOpen = false">✕</button>
      </div>
      <div class="problem-md p-4 overflow-y-auto flex-1 min-h-0" x-html="renderedProblemHtml()"></div>
    </div>
  </div>

  <!-- Docked/maximizable transcript panel -->
  <div x-show="panelOpen" x-cloak
       class="panel-transition fixed bg-[#0e1013] border-t border-[#1c2027] shadow-2xl flex flex-col z-10"
       :class="maximized ? 'inset-0' : 'bottom-0 inset-x-0 h-2/5'"
       @keydown.window.escape="onEscape()">
    <div class="flex items-center gap-3 px-4 py-2 border-b border-[#1c2027] text-sm shrink-0">
      <span class="font-mono" x-text="panelTitle"></span>
      <template x-if="availableKeys.length > 1">
        <div class="flex gap-1">
          <template x-for="k in availableKeys" :key="k">
            <span class="key-chip" :class="{ active: k === currentKey }"
                  @click="openTranscript(selectedNode, k)" x-text="k"></span>
          </template>
        </div>
      </template>
      <button class="icon-btn ml-auto" @click="maximized = !maximized"
              title="Toggle maximize (Esc to restore/close)">
        <span x-text="maximized ? '⤡' : '⤢'"></span>
      </button>
      <button class="icon-btn" @click="closePanel()" title="Close">✕</button>
    </div>
    <div class="overflow-y-auto p-4 flex-1 relative"
         id="bubble-container"
         @scroll="onBubbleScroll($event)">
      <div x-ref="bubbles"></div>
      <p class="empty" x-show="availableKeys.length === 0">
        No delegations yet for this node.
      </p>
    </div>
    <button x-show="showJumpToNew" @click="scrollToBottom()"
            class="absolute bottom-4 right-4 bg-[#1b1f26] border border-[#262b33] rounded-full px-3 py-1 text-xs">
      ↓ new
    </button>
  </div>

  <script>
    function viewerApp() {
      return {
        runId: {{ run_id | tojson }},
        rows: [],
        edges: [],
        nodeStatus: {},       // node name -> "running" | "done" | "failed"
        selectedNode: null,
        availableKeys: [],
        currentKey: null,
        panelOpen: false,
        maximized: false,
        panelTitle: '',
        renderedCount: 0,
        stickToBottom: true,
        showJumpToNew: false,
        problemOpen: false,
        problemText: '',
        _pollHandle: null,
        // null = still running (run_status.json doesn't exist yet, written
        // only once at the very end); otherwise the parsed run_status.json
        // object, e.g. {status: "GATED"} or {status: "FAILED", stop_reason: "..."}.
        runStatus: null,
        toolDocs: {},          // tool name -> docstring, for the hover badges
        hoverNode: null,       // the node dict currently shown in the hover card
        hoverStyle: '',
        _hoverHideTimer: null,

        init() {
          fetch(`/api/runs/${this.runId}/graph`)
            .then(r => r.json())
            .then(spec => {
              this.edges = spec.edges;
              this.toolDocs = spec.tool_docs || {};
              const byLayer = {};
              for (const n of spec.nodes) {
                (byLayer[n.layer] ||= []).push(n);
              }
              this.rows = Object.keys(byLayer).sort((a, b) => a - b)
                .map(l => ({ layer: l, nodes: byLayer[l].sort((a, b) => a.name.localeCompare(b.name)) }));
              this.$nextTick(() => this.drawEdges());
            });

          const es = new EventSource(`/api/runs/${this.runId}/stream`);
          es.addEventListener('delegation', (ev) => {
            const row = JSON.parse(ev.data);
            const label = row.status === 'RUNNING' ? 'running'
              : row.status.includes('FAIL') ? 'failed' : 'done';
            this.nodeStatus[row.to_node] = label;
            // A node currently open in the panel just finished: one last
            // fetch to pick up any trailing content, then stop polling —
            // no reason to keep hitting a delegation that's done/failed.
            if (row.to_node === this.selectedNode && label !== 'running') {
              this.fetchMore(() => this.stopPolling());
            }
          });

          es.addEventListener('run_status', (ev) => {
            this.runStatus = JSON.parse(ev.data);
          });

          window.addEventListener('resize', () => this.drawEdges());
        },

        statusClass(name) {
          return this.nodeStatus[name] || '';
        },

        displayToolName(name) {
          // Mirrors the server's own _display_tool_name(): strip a leading
          // mcp__<server>__ registration prefix for readability. The raw
          // name is still what the badge's title tooltip carries the doc
          // under (looked up by the FULL name in toolDocs).
          const m = name.match(/^mcp__[^_]+(?:_[^_]+)*__(.+)$/);
          return m ? m[1] : name;
        },

        onNodeHover(node, ev) {
          clearTimeout(this._hoverHideTimer);
          const rect = ev.currentTarget.getBoundingClientRect();
          const cardWidth = 280;
          let left = rect.left;
          if (left + cardWidth > window.innerWidth - 12) {
            left = window.innerWidth - cardWidth - 12;
          }
          // Clamp top too: a node with many tools/a long system prompt can
          // produce a tall card, so starting it too low would leave almost
          // nothing visible above the fold. max-height is set here (not in
          // CSS) because it depends on `top` itself -- the card must never
          // extend past the viewport bottom regardless of where it starts.
          const top = Math.min(rect.bottom + 8, window.innerHeight - 100);
          const maxHeight = window.innerHeight - top - 12;
          this.hoverStyle =
            `top:${top}px; left:${Math.max(12, left)}px; max-height:${maxHeight}px;`;
          this.hoverNode = node;
        },

        onNodeLeave() {
          // A short grace period: the mouse crosses a gap between the node
          // card and the popover below it, which would otherwise fire this
          // leave and immediately hide the card before the mouse arrives.
          this._hoverHideTimer = setTimeout(() => { this.hoverNode = null; }, 150);
        },

        onPopoverEnter() {
          clearTimeout(this._hoverHideTimer);
        },

        onPopoverLeave() {
          this.hoverNode = null;
        },

        // The per-node dots only ever reflect that node's most recent
        // INCOMING delegation (the entry node never has one, hence its
        // permanently grey dot) -- this pill is the separate, global "how
        // did the whole run turn out" signal, sourced from run_status.json,
        // which is written exactly once at the very end of the run.
        runStatusLabel() {
          if (this.runStatus === null) return 'running';
          return this.runStatus.status.toLowerCase();
        },

        runStatusClass() {
          if (this.runStatus === null) return 'running';
          return this.runStatus.status.toLowerCase();
        },

        runStatusTitle() {
          if (this.runStatus === null) return 'Run still in progress';
          const reason = this.runStatus.stop_reason;
          return reason ? `stop reason: ${reason}` : '';
        },

        openProblemStatement() {
          fetch(`/api/runs/${this.runId}/problem_statement`)
            .then(r => r.ok ? r.json() : r.json().then(e => ({ text: `(${e.error})` })))
            .then(data => { this.problemText = data.text; this.problemOpen = true; });
        },

        renderedProblemHtml() {
          if (!this.problemText) return '';
          return marked.parse(this.problemText);
        },

        openNode(node) {
          // A click is a more deliberate action than a hover -- don't leave
          // the transient info popover sitting on top of the panel it just
          // opened, waiting on its own mouseleave timer to clear it.
          clearTimeout(this._hoverHideTimer);
          this.hoverNode = null;
          this.selectedNode = node.name;
          fetch(`/api/runs/${this.runId}/node/${node.name}/transcripts`)
            .then(r => r.json())
            .then(keys => {
              this.availableKeys = keys;
              this.panelOpen = true;
              if (keys.length === 0) {
                this.currentKey = null;
                this.panelTitle = node.name;
                this.stopPolling();
                this.clearBubbles();
                return;
              }
              this.openTranscript(node.name, keys[keys.length - 1]);
            });
        },

        openTranscript(nodeName, key) {
          this.currentKey = key;
          this.panelTitle = `${nodeName} · ${key}`;
          this.clearBubbles();
          this.startPolling();
        },

        startPolling() {
          this.stopPolling();
          this.renderedCount = 0;
          this.fetchMore();
          this._pollHandle = setInterval(() => this.fetchMore(), 2000);
        },

        stopPolling() {
          if (this._pollHandle) {
            clearInterval(this._pollHandle);
            this._pollHandle = null;
          }
        },

        fetchMore(afterSuccess) {
          if (!this.currentKey || !this.panelOpen) return;
          const key = this.currentKey;
          fetch(`/api/runs/${this.runId}/transcript/${key}/fragment?after=${this.renderedCount}`)
            .then(r => r.text().then(html => (
              { ok: r.ok, html, count: r.headers.get('X-Event-Count') })))
            .then(({ ok, html, count }) => {
              // A different node/transcript was opened while this request
              // was in flight -- discard the stale response.
              if (key !== this.currentKey) return;
              if (!ok) {
                this.$refs.bubbles.innerHTML = `<p class="empty">${html}</p>`;
                this.stopPolling();
                return;
              }
              if (html) {
                this.$refs.bubbles.insertAdjacentHTML('beforeend', html);
                if (this.stickToBottom) this.scrollToBottom();
                else this.showJumpToNew = true;
              }
              // The cursor MUST count raw transcript events, not rendered
              // bubbles: most events (stream_evt/partial/result) render to
              // no bubble at all, so a bubble-count cursor falls behind the
              // raw list and re-matches already-shown events on every poll
              // — confirmed for real to duplicate content indefinitely on
              // an already-finished run (527 raw events, 47 bubbles).
              // X-Event-Count is the server's own raw count for this call.
              if (count !== null) this.renderedCount = parseInt(count, 10);
              if (afterSuccess) afterSuccess();
            })
            .catch(() => this.stopPolling());
        },

        clearBubbles() {
          this.renderedCount = 0;
          this.showJumpToNew = false;
          this.stickToBottom = true;
          if (this.$refs.bubbles) this.$refs.bubbles.innerHTML = '';
        },

        closePanel() {
          this.stopPolling();
          this.panelOpen = false;
          this.maximized = false;
          this.selectedNode = null;
        },

        onEscape() {
          if (this.maximized) this.maximized = false;
          else this.closePanel();
        },

        onBubbleScroll(ev) {
          const el = ev.target;
          const atBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 40;
          this.stickToBottom = atBottom;
          if (atBottom) this.showJumpToNew = false;
        },

        scrollToBottom() {
          const el = document.getElementById('bubble-container');
          el.scrollTop = el.scrollHeight;
          this.showJumpToNew = false;
        },

        drawEdges() {
          const svg = document.getElementById('edges-svg');
          const container = document.getElementById('graph-container');
          const crect = container.getBoundingClientRect();
          svg.innerHTML = '';
          for (const e of this.edges) {
            const src = document.querySelector(`[data-node="${e.source}"]`);
            const dst = document.querySelector(`[data-node="${e.target}"]`);
            if (!src || !dst) continue;
            const s = src.getBoundingClientRect();
            const d = dst.getBoundingClientRect();
            const x1 = s.left + s.width / 2 - crect.left;
            const y1 = s.bottom - crect.top;
            const x2 = d.left + d.width / 2 - crect.left;
            const y2 = d.top - crect.top;
            const midY = (y1 + y2) / 2;
            const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            path.setAttribute('d', `M ${x1},${y1} C ${x1},${midY} ${x2},${midY} ${x2},${y2}`);
            svg.appendChild(path);
          }
        },
      };
    }
  </script>
