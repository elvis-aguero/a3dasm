ritic PASS.", "file": "src/a3dasm/_src/nodes/tools/routing/feedback.py", "line": 353, "doc": "Synchronous adversarial review; a run closes only on a critic PASS.", "signature": "FeedbackTools._critic_gate", "done_order": null}, {"id": "cited", "title": "Cited delegation must exist", "kind": "hard", "phase": "HypothesisUpdate()", "module": "nodes/tools/routing/ledger.py", "symbol": "LedgerTools._check_cited_delegation", "effect": "Evidence must name a delegation that actually ran.", "file": "src/a3dasm/_src/nodes/tools/routing/ledger.py", "line": 175, "doc": "A verdict must be attributable to ONE completed delegation.\n\nSingle-source attribution (the principle behind what used to be a\nprompt format-rule): a closing verdict cites the ONE delegation whose\nreport contains the cited numbers. A list / comma-joined value can't be\nattributed to a single source, so it is rejected here — the tool is the\nright place for this, not the prompt (CLAUDE.md §2).", "signature": "LedgerTools._check_cited_delegation", "done_order": null}, {"id": "links", "title": "Delegation hypothesis links", "kind": "hard", "phase": "Delegate()", "module": "nodes/tools/routing/delegation.py", "symbol": "DelegationTools._check_hypothesis_links", "effect": "A delegation must be anchored to hypotheses that exist.", "file": "src/a3dasm/_src/nodes/tools/routing/delegation.py", "line": 1218, "doc": "Enforce hypothesis linkage when the ledger is active; else None.", "signature": "DelegationTools._check_hypothesis_links", "done_order": null}, {"id": "duplicate", "title": "Duplicate evaluations", "kind": "soft", "phase": "continuous", "module": "epistemics/science_monitor.py", "symbol": "ScienceMonitor._check_duplicate_evaluations", "effect": "Injected as an in-band notice; never blocks.", "file": "src/a3dasm/_src/epistemics/science_monitor.py", "line": 128, "doc": "DUPLICATE_EVALUATION: a delegation re-evaluated a design point\nalready FINISHED, unchanged, in the ledger — wasted budget, no new\nevidence odule": "nodes/parsing.py", "symbol": "_classify_response", "effect": "A malformed worker report is diagnosed and retried.", "file": "src/a3dasm/_src/nodes/parsing.py", "line": 165, "doc": "Return a REFLECT diagnosis string if text is malformed, else None.\n\nParameters\n----------\ntext : str\n    The raw response text from a worker agent.\nrequired_sections : list[str] or None\n    Subsection headers that must appear in the ``## Report`` block.\n    When ``None`` the four default sections from\n    ``_REQUIRED_SUBSECTIONS`` are used.", "signature": "_classify_response", "done_order": null}, {"id": "reproduction", "title": "Reproduction gate", "kind": "hard", "phase": "Done() + CheckDeliverable()", "module": "nodes/reproduction_gate.py", "symbol": "ReproductionGateMixin._reproduction_gate", "effect": "pipeline.ipynb must execute cleanly, add zero oracle rows and rewrite none.", "file": "src/a3dasm/_src/nodes/reproduction_gate.py", "line": 92, "doc": "Execute pipeline.ipynb under a CONTROLLED reproduction gate.\n\nThe binding reproducibility check. The pipeline must:\n  (a) finish cleanly within a time ceiling (no heavy from-scratch run);\n  (b) add ZERO new oracle rows (lazy: skip FINISHED evals);\n  (c) NOT modify/delete existing ledger rows (integrity — no faking the\n      zero-delta by delete+re-add or value rewrite);\n  (d) print ``REPRODUCED: <value>`` — an informational headline marker\n      for the critic/human; the runtime does NOT gate on it. Headline\n      grounding (the value traces to a real ledger row) is the critic's\n      HEADLINE PROVENANCE check, not an independent runtime extremum\n      match (which wrongly rejected constrained optima).\nReturns None on PASS (and stashes ``self._repro_ok_detail``), else a\nproblem string. Skips silently when there is no run context. Callable\nwithout ``state`` — study dir comes from ``self._study_dir``.\n\nOn PASS the deliverable is a faithful, lightweight, lazy reproduction —\nnot a script doing \"sneaky stuff\" unrelated to validating the pipeline.", "signature": "ReproductionGateMixin._reproduction_gate", "done_order": null}, {"id": "deliverables", "title": "Required deliverables present", "kind": "hard", "phase": "Done() + CheckDeliverable()", "module": "nodes/reproduction_gate.py", "symbol": "ReproductionGateMixin._missing_deliverables", "effect": "Names any required deliverable that is absent.", "file": "src/a3dasm/_src/nodes/reproduction_gate.py", "line": 54, "doc": "Return required deliverable paths not present at study_dir yet.\n\nThe single deliverable (pipeline.ipynb) is required, authored before\nDone() is accepted, UNLESS the study turns off pipeline_deliverable —\nit is the human-readable recipe AND the reproduction in one notebook:\nthe runtime executes it lazily (see _reproduction_gate) to verify the\nheadline re-derives from the ledger with zero new evals, which makes\nno sense for a study with no ledger at all. Requiring it unconditionally\n(BACKLOG #30) meant a pure-derivation study's strategizer could never\nsatisfy Done() regardless of what its own tools/prompt said — this was\nthe third of three places that assumption was baked in (the other two,\nthe injected notebook_deliverable_spec() preamble and the notebook-\nauthoring tools themselves, are already gated the same way). Additional\npaths can still be declared in state['required_deliverables']\nregardless of this flag.", "signature": "ReproductionGateMixin._missing_deliverables", "done_order": null}, {"id": "supported", "title": "SUPPORTED needs an attempt", "kind": "hard", "phase": "HypothesisUpdate()", "module": "nodes/tools/routing/ledger.py", "symbol": "LedgerTools._supported_needs_attempt", "effect": "Refused synchronously at the data boundary.", "file": "src/a3dasm/_src/nodes/tools/routing/ledger.py", "line": 127, "doc": "SUPPORTED without a completed falsification attempt: a TWO-SHOT CONFIRM.\n\nNot a hard block (§4, user-approved). A verdict is reversible when\njustified in writing, so const LAYER_COLOR = {preamble:"#4a7fa5", system:"#1e5f8f", deliverable:"#6f8f4f", catalog:"#8a6a3d"};
const LAYER_NAME  = {preamble:"runtime preamble", system:"role instructions",
                     deliverable:"deliverable contract", catalog:"tool catalog"};

const $ = (s,r=document)=>r.querySelector(s);
const esc = s => String(s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const num = n => n.toLocaleString("en-US");
const srcOf = s => s ? `${s.file}:${s.line}` : "—";

let view = {kind:"role", id:DATA.roles[0].id};
let query = "";

/* ---------------- rail ---------------- */
function buildRail(){
  const roles = $("#rail-roles");
  DATA.roles.forEach(r=>{
    const b = document.createElement("button");
    b.className="railbtn"; b.type="button"; b.dataset.role=r.id;
    b.innerHTML = `<span>${esc(r.id)}</span><em>${num(r.static_chars)}</em>`;
    b.onclick = ()=>{ view={kind:"role",id:r.id}; query=""; $("#q").value=""; render(); };
    roles.appendChild(b);
  });
  const views = $("#rail-views");
  [["gates","Gates",DATA.gates.length],["config","Config knobs",DATA.switches.length],
   ["shared","Shared blocks",DATA.shared.length]].forEach(([k,label,n])=>{
    const b=document.createElement("button");
    b.className="railbtn"; b.type="button"; b.dataset.view=k;
    b.innerHTML=`<span>${label}</span><em>${n}</em>`;
    b.onclick=()=>{ view={kind:k}; query=""; $("#q").value=""; render(); };
    views.appendChild(b);
  });
  $("#stamp").textContent = `${DATA.commit} · ${DATA.generated_at}`;
}

function syncRail(){
  document.querySelectorAll(".railbtn").forEach(b=>{
    const on = query ? false
      : (view.kind==="role" ? b.dataset.role===view.id : b.dataset.view===view.kind);
    b.setAttribute("aria-current", on ? "true" : "false");
  });
}

/* ---------------- pieces ---------------- */
function sourceLink(s){
  if(!s) return `<span class="src">unresolved</span>`;
  const approx = s.match && s.match!=="exact"
    ? ` <span class="chip" title="Located by ${s.match} match — the block is assembled from pieces, so this is the line the text starts at.">≈ ${s.match}</span>` : "";
  return `<span class="src">${esc(srcOf(s))}</span>${approx}`;
}

function sectionRow(sec, key){
  const preview = sec.text.trim().split("\n")[0].slice(0,90);
  return `<div class="row" data-open="false">
    <button class="rowbtn" type="button" data-toggle="${key}">
      <svg class="chev" width="9" height="9" viewBox="0 0 9 9" aria-hidden="true"><path d="M2 1l4 3.5L2 8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <span class="rowtag">${sec.tag ? `&lt;${esc(sec.tag)}&gt;` : `<i>${esc(preview)}</i>`}</span>
      <span class="rowspacer"></span>
      <span class="rowsrc">${esc(srcOf(sec.source))}</span>
      <span class="rowchars">${num(sec.chars)}</span>
    </button>
    <div class="rowbody" hidden>
      <div class="rowmeta">
        ${sourceLink(sec.source)}
        ${sec.injects ? `<span class="chip k-accent">injected verbatim · ${esc(sec.injects.name)} @ ${esc(sec.injects.file)}:${sec.injects.line}</span>` : ""}
        ${sec.substituted ? `<span class="chip">values substituted per run</span>` : ""}
        ${sec.generated ? `<span class="chip">assembled by function</span>` : ""}
        <button class="copy" type="button" data-copy="${key}">copy text</button>
      </div>
      <pre class="prompt" id="txt-${key}">${esc(sec.text)}</pre>
    </div>
  </div>`;
}

/* ---------------- role view ---------------- */
function renderRole(r){
  const measured = r.layers.filter(l=>l.chars);
  const total = measured.reduce((a,l)=>a+l.chars,0);

  const bar = measured.map(l=>{
    const pct = l.chars/total*100;
    return `<div class="compseg" style="width:${pct}%;background:${LAYER_COLOR[l.kind]}"
      title="${esc(LAYER_NAME[l.kind])} — ${num(l.chars)} chars">
      <span>${pct>11 ? Math.round(pct)+"%" : ""}</span></div>`;
  }).join("");

  const legend = measured.map(l=>
    `<span><i style="background:${LAYER_COLOR[l.kind]}"></i>${esc(LAYER_NAME[l.kind])}
     <em>${num(l.chars)}</em></span>`).join("");

  const layers = r.layers.map((l,li)=>{
    let body;
    if(l.kind==="catalog"){
      body = `<div class="rows"><div class="tools">${
        l.tools.map(t=>`<span class="chip">${esc(t)}</span>`).join("")}</div></div>`;
    } else {
      body = `<div class="rows">${l.sections.map((s,si)=>sectionRow(s,`${r.id}-${li}-${si}`)).join("")}</div>`;
    }
    return `<section class="layer">
      <div class="layerhead">
        <h2>${esc(l.label)}</h2>
        ${l.chars ? `<span class="chip">${num(l.chars)} chars</span>` : `<span class="chip">run-scoped</span>`}
        ${l.switch ? `<span class="chip k-soft">knob · ${esc(l.switch)}</span>` : ""}
      </div>
      <p class="layernote">${esc(l.note)}
        ${l.definition ? ` <code>${esc(l.definition.file)}:${l.definition.line}</code>` : ""}
        ${l.assembled_at ? ` · assembled at <code>${esc(srcOf(l.assembled_at))}</code>` : ""}</p>
      ${body}
    </section>`;
  }).join("");

  return `<p class="eyebrow">${r.entry ? "Entry node" : "Worker node"}</p>
    <h1>${esc(r.id)}</h1>
    <p class="lede">Everything below is in this agent's context window before it reads a
      single word of its task. Each row cites the file and line it comes from.</p>
    <div class="facts">
      <span><b>class</b> ${esc(r.class)}</span>
      <span><b>defined</b> ${esc(r.module)}</span>
      <span><b>tools</b> ${r.tool_count}</span>
      <span><b>delegates to</b> ${r.delegates_to.length ? esc(r.delegates_to.join(", ")) : "—"}</span>
    </div>
    <div class="comp">
      <div class="compbar">${bar}</div>
      <div class="complegend">${legend}
        <span><i style="background:transparent;border:1px solid var(--line)"></i>total
        <em>${num(total)} chars ≈ ${num(Math.round(total/4))} tokens</em></span>
      </div>
    </div>
    ${layers}`;
}

/* ---------------- gates ---------------- */
function gateCard(g, n){
  return `<article class="gate" data-kind="${esc(g.kind)}">
    <div class="gatenum">${n ?? "·"}</div>
    <div class="gatebody">
      <div class="gatetop">
        <h3>${esc(g.title)}</h3>
        <span class="chip k-${esc(g.kind)}">${esc(g.kind)}</span>
        <span class="chip">${esc(g.phase)}</span>
        ${g.switch ? `<span class="chip k-soft">off via ${esc(g.switch)}</span>` : ""}
        ${g.escape ? `<span class="chip">escape · ${esc(g.escape)}</span>` : ""}
      </div>
      <p class="gateeffect">${esc(g.effect)}</p>
      ${g.doc ? `<p class="gatedoc">${esc(g.doc)}</p>` : ""}
      <div class="gatefoot">
        <span class="src">${esc(g.file)}:${g.line}</span>
        <span class="chip">${esc(g.symbol)}</span>
        ${g.policy ? `<span class="chip">policy · ${esc(g.policy[0])}::${esc(g.policy[1])}</span>` : ""}
      </div>
    </div>
  </article>`;
}

function renderGates(){
  const chain = DATA.gates.filter(g=>g.done_order).sort((a,b)=>a.done_order-b.done_order);
  const rest  = DATA.gates.filter(g=>!g.done_order);
  const byPhase = {};
  rest.forEach(g=>(byPhase[g.phase] ||= []).push(g));

  const counts = ["hard","soft","procedural","advisory"].map(k=>{
    const n = DATA.gates.filter(g=>g.kind===k).length;
    return `<span class="chip k-${k}">${n} ${k}</span>`;
  }).join(" ");

  return `<p class="eyebrow">Machinery</p>
    <h1>What can stop the run</h1>
    <p class="lede">Every checkpoint between an agent's intention and its effect, with the
      symbol that implements it. A <em>hard</em> gate refuses; a <em>soft</em> one speaks and
      lets the agent proceed.</p>
    <div class="facts" style="gap:6px">${counts}</div>

    <div class="sectionhead"><h2>The Done() sequence</h2>
      <p>Parsed from the literal tuple in <code>feedback.py</code> — this is the source's own order,
         not a reconstruction. A gate that holds returns immediately; nothing after it runs.</p></div>
    <div class="chain">${chain.map(g=>gateCard(g,g.done_order)).join("")}</div>

    ${Object.entries(byPhase).map(([phase,gs])=>`
      <div class="sectionhead"><h2>${esc(phase)}</h2>
        <p>${gs.length} checkpoint${gs.length>1?"s":""}, unordered — each fires on its own trigger.</p></div>
      <div class="chain">${gs.map(g=>gateCard(g,null)).join("")}</div>`).join("")}`;
}

/* ---------------- config ---------------- */
function renderConfig(){
  return `<p class="eyebrow">Machinery</p>
    <h1>Config knobs</h1>
    <p class="lede">Everything a reviewer can change without editing code. Resolution order is
      environment variable, then the study's <code>config.yaml</code> <code>runtime:</code> block,
      then the default — and an unrecognised key is reported rather than silently ignored.</p>
    <div class="sectionhead"><h2>${DATA.switches.length} knobs</h2>
      <p>Read from <code>runtime/settings.py</code> and from the environment reads found in source.</p></div>
    <div class="tablewrap"><table>
      <thead><tr><th>Key</th><th>Set via</th><th>Environment override</th><th>Read at</th></tr></thead>
      <tbody>${DATA.switches.map(s=>`<tr>
        <td class="m">${esc(s.key)}</td>
        <td>${esc(s.kind)}</td>
        <td class="m">${esc(s.env)}</td>
        <td class="m path">${esc((s.sites||[s.file]).join("  "))}</td>
      </tr>`).join("")}</tbody>
    </table></div>`;
}

/* ---------------- shared blocks ---------------- */
function renderShared(){
  return `<p class="eyebrow">Machinery</p>
    <h1>Shared blocks</h1>
    <p class="lede">Text defined once and injected verbatim into more than one role, so two agents
      can cite the same clause number at each other without paraphrase drift.</p>
    ${DATA.shared.map((b,i)=>{
      const used = DATA.roles.filter(r=>r.layers.some(l=>
        l.sections.some(s=>s.injects && s.injects.name===b.name))).map(r=>r.id);
      return `<section class="layer">
        <div class="layerhead"><h2>${esc(b.name)}</h2>
          <span class="chip">${num(b.chars)} chars</span>
          <span class="chip k-accent">in ${esc(used.join(", ")||"—")}</span></div>
        <p class="layernote">Defined at <code>${esc(b.file)}:${b.line}</code></p>
        <div class="rows">${sectionRow({tag:b.name,text:b.text,chars:b.chars,
          source:{file:b.file,line:b.line,match:"exact"}}, `shared-${i}`)}</div>
      </section>`;
    }).join("")}`;
}

/* ---------------- search ---------------- */
function renderSearch(q){
  const needle = q.toLowerCase();
  const hits = [];
  DATA.roles.forEach(r=>r.layers.forEach(l=>l.sections.forEach(s=>{
    const i = s.text.toLowerCase().indexOf(needle);
    if(i<0) return;
    hits.push({where:`${r.id} › ${s.tag ? "<"+s.tag+">" : l.label}`,
               src:srcOf(s.source), text:s.text, i,
               n:s.text.toLowerCase().split(needle).length-1});
  })));
  DATA.gates.forEach(g=>{
    const hay = (g.title+" "+g.effect+" "+g.doc+" "+g.symbol).toLowerCase();
    const i = hay.indexOf(needle);
    if(i>=0) hits.push({where:`gate › ${g.title}`, src:`${g.file}:${g.line}`,
                        text:g.effect+"\n"+g.doc, i:Math.max(0,(g.effect+"\n"+g.doc).toLowerCase().indexOf(needle)), n:1});
  });
  hits.sort((a,b)=>b.n-a.n);

  const body = hits.length ? hits.map(h=>{
    const from = Math.max(0, h.i-180), to = Math.min(h.text.length, h.i+needle.length+280);
    const raw = (from?"…":"") + h.text.slice(from,to) + (to<h.text.length?"…":"");
    const re = new RegExp(needle.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"), "gi");
    const marked = esc(raw).replace(re, m=>`<mark>${m}</mark>`);
    return `<div class="hit">
      <div class="hittop"><b>${esc(h.where)}</b>
        <span class="src">${esc(h.src)}</span>
        <span class="chip">${h.n} match${h.n>1?"es":""}</span></div>
      <p class="hitex">${marked}</p></div>`;
  }).join("") : `<p class="empty">No prompt text or gate mentions “${esc(q)}”.</p>`;

  return `<p class="eyebrow">Search</p>
    <h1>“${esc(q)}”</h1>
    <p class="lede">${hits.length} place${hits.length===1?"":"s"} in the assembled prompts and gate
      definitions. Every result carries the file and line to open.</p>
    <div class="sectionhead"><h2>Results</h2><p>Ordered by number of matches in the block.</p></div>
    ${body}`;
}

/* ---------------- render ---------------- */
function render(){
  const main = $("#main");
  if(query.trim().length>=2){ main.innerHTML = renderSearch(query.trim()); }
  else if(view.kind==="role"){ main.innerHTML = renderRole(DATA.roles.find(r=>r.id===view.id)); }
  else if(view.kind==="gates"){ main.innerHTML = renderGates(); }
  else if(view.kind==="config"){ main.innerHTML = renderConfig(); }
  else { main.innerHTML = renderShared(); }
  syncRail();
  main.scrollTop = 0;
}

document.addEventListener("click", e=>{
  const t = e.target.closest("[data-toggle]");
  if(t){
    const row = t.closest(".row");
    const open = row.dataset.open === "true";
    row.dataset.open = open ? "false" : "true";
    row.querySelector(".rowbody").hidden = open;
    return;
  }
  const c = e.target.closest("[data-copy]");
  if(c){
    const txt = document.getElementById("txt-"+c.dataset.copy).textContent;
    navigator.clipboard?.writeText(txt).then(()=>{
      c.textContent = "copied"; setTimeout(()=>c.textContent="copy text", 1400);
    });
  }
});

$("#q").addEventListener("input", e=>{ query = e.target.value; render(); });
document.addEventListener("keydown", e=>{
  if(e.key==="/" && e.target.tagName!=="INPUT"){ e.preventDefault(); $("#q").focus(); }
  if(e.key==="Escape" && e.target.id==="q"){ e.target.value=""; query=""; render(); }
});

buildRail();
render();
</script>
